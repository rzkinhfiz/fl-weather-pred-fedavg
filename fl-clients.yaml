---
# =============================================================================
# ServiceAccount: Client Pod Identity
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fl-client
  namespace: flower-fl
  labels:
    app: flower
    component: client

---
# =============================================================================
# Role: Client Permissions
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fl-client
  namespace: flower-fl
  labels:
    app: flower
    component: client
rules:
  # Allow clients to read ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  
  # Allow clients to write logs/events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
# =============================================================================
# RoleBinding: Bind Role to ServiceAccount
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fl-client
  namespace: flower-fl
  labels:
    app: flower
    component: client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fl-client
subjects:
  - kind: ServiceAccount
    name: fl-client
    namespace: flower-fl

# =============================================================================
# DEPLOYMENT NOTES:
# =============================================================================
#
# This manifest shows all 15 clients (3 fully defined + 12 as template).
# You have several deployment options:
#
# OPTION 1: Manual (shown here - 3 full + 12 template pattern)
#   - Copy the template 12 times, incrementing CITY_ID and city names
#   - Apply with: kubectl apply -f fl-clients.yaml
#
# OPTION 2: Using Kustomization (recommended for scaling)
#   - Create a kustomization.yaml with patches
#   - Use Kustomize to generate all 15 variations
#   - Apply with: kubectl apply -k ./
#
# OPTION 3: Using Helm (enterprise-grade)
#   - Create values.yaml with city list
#   - Create Helm templates
#   - Deploy with: helm install fl-clients ./helm/fl-clients
#
# OPTION 4: Using a Shell Script to Generate YAML
#   - Generate all 15 pods programmatically
#   - Apply with: bash generate-clients.sh | kubectl apply -f -
#
# For now, use OPTION 1 or 2 (Kustomization is recommended).
#
# =============================================================================
