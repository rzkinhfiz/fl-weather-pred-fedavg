# =============================================================================
# fl-clients.yaml - Kubernetes Pods for 15 FL Clients (Multi-City)
# =============================================================================
# 15 federated learning clients (one per city) with strict resource limits
# Each client: 0.5 CPU / 700-800Mi Memory
# Total: ~10.5GB for 15 clients (safe for 16GB system)
#
# Cities (CITY_ID 0-14):
#   0: Berlin      5: Jeddah      10: Riyadh
#   1: Cairo       6: London      11: Singapore
#   2: Dammam      7: Mumbai      12: Sydney
#   3: Doha        8: New York    13: Tokyo
#   4: Dubai       9: Paris       14: Toronto
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: flower-fl
  labels:
    name: flower-fl

---
# =============================================================================
# ConfigMap: Client Configuration (Shared)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fl-client-config
  namespace: flower-fl
data:
  # Server address (internal K8s DNS)
  SERVER_ADDRESS: "fl-server.flower-fl.svc.cluster.local:8080"
  # Log level
  LOG_LEVEL: "INFO"
  # Python optimization
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

---
# =============================================================================
# CLIENT 0: Berlin
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: fl-client-0-berlin
  namespace: flower-fl
  labels:
    app: flower
    component: client
    city-id: "0"
    city-name: berlin
    version: v1
  annotations:
    city: "Berlin"
    dataset: "weather_berlin"
spec:
  serviceAccountName: fl-client
  
  # Restart policy
  restartPolicy: OnFailure
  
  # Init container: Wait for server to be ready
  initContainers:
    - name: wait-for-server
      image: busybox:1.28
      command: ['sh', '-c']
      args:
        - |
          echo "Waiting for FL server to be ready..."
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if nc -z fl-server.flower-fl.svc.cluster.local 8080; then
              echo "✓ Server is ready!"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - Server not ready yet..."
            sleep 2
          done
          echo "✗ Server failed to become ready after $max_attempts attempts"
          exit 1
  
  # Containers
  containers:
    - name: client
      image: fl-weather-client:latest
      imagePullPolicy: IfNotPresent
      
      # Environment variables
      env:
        - name: CITY_ID
          value: "0"
        - name: SERVER_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: fl-client-config
              key: SERVER_ADDRESS
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: fl-client-config
              key: LOG_LEVEL
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: fl-client-config
              key: PYTHONUNBUFFERED
        - name: PYTHONDONTWRITEBYTECODE
          valueFrom:
            configMapKeyRef:
              name: fl-client-config
              key: PYTHONDONTWRITEBYTECODE
      
      # Resource limits (CRITICAL: strict per-pod limits)
      resources:
        requests:
          cpu: 250m          # 0.25 CPU
          memory: 400Mi      # 400MB
        limits:
          cpu: 500m          # 0.5 CPU
          memory: 750Mi      # 750MB
      
      # Volume mounts
      volumeMounts:
        - name: data
          mountPath: /app/data/processed
          readOnly: true
        - name: logs
          mountPath: /app/logs
          readOnly: false
      
      # Security context
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
  
  # Volumes
  volumes:
    - name: data
      emptyDir: {}  # In production, use PersistentVolume or ConfigMap
    - name: logs
      emptyDir: {}

---
