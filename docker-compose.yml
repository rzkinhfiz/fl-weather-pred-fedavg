      config:
        - subnet: 172.20.0.0/16

# ===========================================================================
# COMMAND REFERENCE:
# ===========================================================================
# BUILD:
#   docker compose build
#
# START (all services):
#   docker compose up -d
#
# STOP (all services):
#   docker compose down
#
# VIEW LOGS:
#   docker compose logs -f fl-server
#   docker compose logs -f fl-client-0
#   docker compose logs -f  # all services
#
# CHECK MEMORY USAGE:
#   docker stats
#
# REBUILD & UP:
#   docker compose up -d --build
#
# REMOVE ALL VOLUMES:
#   docker compose down -v
#
# ===========================================================================
