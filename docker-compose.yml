# =============================================================================
# docker-compose.yml - Orkestrasi 15 FL Clients dengan Memory Limits Ketat
# =============================================================================
# Architecture:
# - fl-server:  Central aggregator (GCP e2-micro compatibility)
# - fl-client-0 hingga fl-client-14: 15 city clients
#
# Memory Configuration:
# - Per client: 600-800MB (KETAT)
# - Per server: 512MB
# - Total: ~10.5GB (aman di bawah 16GB laptop dengan buffer OS/Apps)
#
# Startup Strategy:
# - restart: on-failure (toleran terhadap network delay)
# - depends_on: server (wait hingga server ready)
# - Staggered launch dengan healthcheck
# =============================================================================

version: '3.9'

services:
  # ===========================================================================
  # CENTRAL SERVER - Memory-optimized aggregator
  # ===========================================================================
  fl-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fl-server
    image: fl-weather-server:latest
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=INFO
      - NUM_ROUNDS=10
      - MIN_FIT_CLIENTS=3
    volumes:
      - ./logs:/app/logs
    networks:
      - fl-network
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080), timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # FL CLIENTS (0-14) - 15 city-based clients dengan strict memory limits
  # ===========================================================================

  # Client 0: Berlin
  fl-client-0:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: fl-client-0
    image: fl-weather-client:latest
    environment:
      - CITY_ID=0
      - SERVER_ADDRESS=fl-server:8080
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./logs:/app/logs
    networks:
      - fl-network
    depends_on:
      fl-server:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 700M
        reservations:
          cpus: '0.25'
          memory: 400M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

